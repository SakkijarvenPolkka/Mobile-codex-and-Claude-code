org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Native (Audacity core) build settings.
# audacity.abis: comma separated ABI list for the native build.
audacity.abis=arm64-v8a,x86_64
# Set to false to build the Kotlin/Compose app without compiling the native
# Audacity core (UI-only iteration; the app then runs without an engine).
audacity.buildNative=true
